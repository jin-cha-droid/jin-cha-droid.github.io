<!-- 主站访客统计核心代码（带完整日志+兜底） -->
<script>
  // ========== 1. 必改配置（替换为你的真实信息） ==========
  const STATS_CONFIG = {
    // Gist ID（你的Gist地址中的一串字符）
    gistId: "778c919fa51dbc8b932261916da783e7",
    // 统计数据文件名（固定不变）
    statsFile: "blog_stats.json",
    // 仅Gist权限的PAT（ghp_开头，无空格/特殊字符）
    pat: "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"
  };
  // 主站域名（确保只统计这个域名）
  const MAIN_DOMAIN = "https://jin-cha-droid.github.io";

  // ========== 2. 生成唯一访客ID ==========
  function getUniqueVisitorId() {
    let visitorId = localStorage.getItem('main_site_visitor_id');
    if (!visitorId) {
      // 生成规则：确保唯一性
      visitorId = `VIS_${Date.now()}_${Math.random().toString(36).slice(2, 14)}`;
      localStorage.setItem('main_site_visitor_id', visitorId);
      console.log("[统计] 生成新访客ID：", visitorId);
    }
    return visitorId;
  }

  // ========== 3. 初始化Gist文件（首次访问自动创建） ==========
  async function initGistFile() {
    try {
      console.log("[统计] 尝试初始化Gist文件...");
      const initData = {
        visitors: [],
        totalVisits: 0
      };
      const response = await fetch(`https://api.github.com/gists/${STATS_CONFIG.gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `token ${STATS_CONFIG.pat}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          files: {
            [STATS_CONFIG.statsFile]: {
              content: JSON.stringify(initData, null, 2)
            }
          }
        })
      });

      if (response.ok) {
        console.log("[统计] Gist文件初始化成功");
        return initData;
      } else {
        const errText = await response.text();
        console.error("[统计] Gist初始化失败：", response.status, errText);
        return { visitors: [], totalVisits: 0 };
      }
    } catch (error) {
      console.error("[统计] Gist初始化异常：", error.message);
      return { visitors: [], totalVisits: 0 };
    }
  }

  // ========== 4. 读取统计数据 ==========
  async function loadStatsData() {
    try {
      console.log("[统计] 读取统计数据...");
      const response = await fetch(`https://api.github.com/gists/${STATS_CONFIG.gistId}`, {
        headers: {
          'Authorization': `token ${STATS_CONFIG.pat}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        cache: 'no-cache' // 禁用缓存，确保读取最新数据
      });

      if (!response.ok) {
        // 读取失败则初始化
        return await initGistFile();
      }

      const gistData = await response.json();
      // 检查文件是否存在
      if (!gistData.files || !gistData.files[STATS_CONFIG.statsFile]) {
        console.log("[统计] 统计文件不存在，初始化...");
        return await initGistFile();
      }

      const statsContent = gistData.files[STATS_CONFIG.statsFile].content;
      const stats = JSON.parse(statsContent);
      console.log("[统计] 读取数据成功：", stats);
      return stats;
    } catch (error) {
      console.error("[统计] 读取数据异常：", error.message);
      return { visitors: [], totalVisits: 0 };
    }
  }

  // ========== 5. 保存统计数据 ==========
  async function saveStatsData(stats) {
    try {
      console.log("[统计] 保存统计数据...");
      const response = await fetch(`https://api.github.com/gists/${STATS_CONFIG.gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `token ${STATS_CONFIG.pat}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          files: {
            [STATS_CONFIG.statsFile]: {
              content: JSON.stringify(stats, null, 2)
            }
          }
        })
      });

      if (response.ok) {
        console.log("[统计] 数据保存成功！总访问数：", stats.totalVisits);
      } else {
        const errText = await response.text();
        console.error("[统计] 保存失败：", response.status, errText);
      }
    } catch (error) {
      console.error("[统计] 保存异常：", error.message);
    }
  }

  // ========== 6. 核心统计逻辑（强制执行） ==========
  async function trackMainSiteVisit() {
    // 仅统计主站，排除后台页面
    if (!window.location.href.startsWith(MAIN_DOMAIN) || window.location.href.includes('site-stats')) {
      console.log("[统计] 非主站页面，跳过统计");
      return;
    }

    // 必改：验证PAT是否配置
    if (STATS_CONFIG.pat === "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx") {
      console.error("[统计] 错误：未替换PAT！请修改STATS_CONFIG.pat为你的真实PAT");
      alert("统计功能未配置：请替换代码中的PAT为你的GitHub PAT！");
      return;
    }

    const visitorId = getUniqueVisitorId();
    const now = new Date().toISOString();
    // 读取数据（失败则初始化）
    const stats = await loadStatsData();

    // 更新统计
    stats.totalVisits += 1; // 总访问数+1
    const visitorIndex = stats.visitors.findIndex(v => v.id === visitorId);
    if (visitorIndex === -1) {
      // 新访客
      stats.visitors.push({
        id: visitorId,
        firstVisit: now,
        lastVisit: now,
        visitCount: 1
      });
      console.log("[统计] 新访客，已记录");
    } else {
      // 老访客
      stats.visitors[visitorIndex].visitCount += 1;
      stats.visitors[visitorIndex].lastVisit = now;
      console.log("[统计] 老访客，访问次数+1");
    }

    // 保存数据
    await saveStatsData(stats);
  }

  // ========== 7. 页面加载后立即执行（防抖） ==========
  let isTracked = false;
  window.addEventListener('load', async () => {
    if (!isTracked) {
      isTracked = true;
      await trackMainSiteVisit();
    }
  });
  // 备用：DOM加载完成也执行，确保触发
  document.addEventListener('DOMContentLoaded', async () => {
    if (!isTracked) {
      isTracked = true;
      await trackMainSiteVisit();
    }
  });
</script>
