<!-- 主站访客统计代码（唯一统计逻辑，无重复） -->
<script>
  // 1. 配置（替换为你的PAT）
  const CONFIG = {
    gistId: "778c919fa51dbc8b932261916da783e7",
    gistFile: "blog_stats.json",
    pat: "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" // 替换为你的仅Gist权限PAT
  };
  const MAIN_SITE = "https://jin-cha-droid.github.io/";

  // 2. 生成唯一访客ID
  function getVisitorId() {
    let id = localStorage.getItem('main_site_visitor_id');
    if (!id) {
      id = `VIS_${Date.now()}_${Math.random().toString(36).slice(2, 14)}`;
      localStorage.setItem('main_site_visitor_id', id);
    }
    return id;
  }

  // 3. 读取统计数据
  async function loadStats() {
    try {
      const res = await fetch(`https://api.github.com/gists/${CONFIG.gistId}`, {
        headers: {
          'Authorization': `token ${CONFIG.pat}`,
          'Content-Type': 'application/json'
        }
      });
      if (!res.ok) return { visitors: [], totalVisits: 0 };
      const gist = await res.json();
      const content = gist.files[CONFIG.gistFile]?.content || JSON.stringify({ visitors: [], totalVisits: 0 });
      return JSON.parse(content);
    } catch (e) {
      return { visitors: [], totalVisits: 0 };
    }
  }

  // 4. 保存统计数据
  async function saveStats(stats) {
    try {
      await fetch(`https://api.github.com/gists/${CONFIG.gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `token ${CONFIG.pat}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          files: { [CONFIG.gistFile]: { content: JSON.stringify(stats, null, 2) } }
        })
      });
    } catch (e) {}
  }

  // 5. 执行统计
  async function trackVisit() {
    if (!window.location.href.startsWith(MAIN_SITE)) return;
    const visitorId = getVisitorId();
    const now = new Date().toISOString();
    const stats = await loadStats();
    
    stats.totalVisits += 1;
    const idx = stats.visitors.findIndex(v => v.id === visitorId);
    if (idx === -1) {
      stats.visitors.push({ id: visitorId, firstVisit: now, lastVisit: now, visitCount: 1 });
    } else {
      stats.visitors[idx].visitCount += 1;
      stats.visitors[idx].lastVisit = now;
    }
    
    await saveStats(stats);
  }

  // 页面加载后触发
  window.addEventListener('load', trackVisit);
</script>
