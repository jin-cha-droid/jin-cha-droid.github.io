<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <!-- 博客基础样式（保留你原有的样式/引入） -->
  <link rel="stylesheet" href="{{ "/css/style.css" | relative_url }}">
  <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" type="image/x-icon">
  <!-- 其他基础引入（如字体、图标等） -->
</head>
<body>
  <!-- 博客头部导航（保留你原有的头部布局） -->
  <header class="site-header">
    <div class="container">
      <h1 class="site-title"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
      <nav class="site-nav">
        <a href="{{ "/" | relative_url }}">首页</a>
        <a href="{{ "/archives" | relative_url }}">归档</a>
        <a href="{{ "/about" | relative_url }}">关于</a>
      </nav>
    </div>
  </header>

  <!-- 博客主要内容区域 -->
  <main class="site-content container">
    {{ content }}
  </main>

  <!-- 博客底部 -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} - 保留所有权利</p>
    </div>
  </footer>

  <!-- ========== 核心：主站访客统计代码（强制生效） ========== -->
  <script>
    // 立即执行函数，确保页面加载后必触发统计
    (async function() {
      // 1. 核心配置（替换为你的真实PAT！）
      const STATS_CONFIG = {
        gistId: "778c919fa51dbc8b932261916da783e7",  // 你的Gist ID
        statsFileName: "blog_stats.json",            // 统计数据文件名
        pat: "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" // 仅Gist权限的PAT，替换为你的！
      };

      // 2. 生成唯一访客ID（不同设备/浏览器不重复）
      function generateUniqueVisitorId() {
        let visitorId = localStorage.getItem('main_site_visitor_id');
        if (!visitorId) {
          // 生成规则：前缀+时间戳+12位随机数，确保唯一性
          visitorId = `VIS_${Date.now()}_${Math.random().toString(36).slice(2, 14)}`;
          localStorage.setItem('main_site_visitor_id', visitorId);
        }
        return visitorId;
      }

      // 3. 读取Gist中的统计数据（无数据则初始化）
      async function loadExistingStats() {
        try {
          const response = await fetch(`https://api.github.com/gists/${STATS_CONFIG.gistId}`, {
            method: 'GET',
            headers: {
              'Authorization': `token ${STATS_CONFIG.pat}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            }
          });

          if (!response.ok) {
            console.warn('读取统计数据失败，使用初始空数据：', response.statusText);
            return { visitors: [], totalVisits: 0 };
          }

          const gistData = await response.json();
          const statsContent = gistData.files[STATS_CONFIG.statsFileName]?.content || JSON.stringify({
            visitors: [],
            totalVisits: 0
          });
          return JSON.parse(statsContent);
        } catch (error) {
          console.error('读取统计数据异常：', error);
          return { visitors: [], totalVisits: 0 };
        }
      }

      // 4. 保存更新后的统计数据到Gist
      async function saveUpdatedStats(stats) {
        try {
          const response = await fetch(`https://api.github.com/gists/${STATS_CONFIG.gistId}`, {
            method: 'PATCH',
            headers: {
              'Authorization': `token ${STATS_CONFIG.pat}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              files: {
                [STATS_CONFIG.statsFileName]: {
                  content: JSON.stringify(stats, null, 2)
                }
              }
            })
          });

          if (response.ok) {
            console.log('访客统计已成功保存！访客ID：', generateUniqueVisitorId());
          } else {
            console.error('保存统计数据失败：', response.statusText);
          }
        } catch (error) {
          console.error('保存统计数据异常：', error);
        }
      }

      // 5. 核心统计逻辑（强制执行）
      const visitorId = generateUniqueVisitorId();
      const now = new Date().toISOString();
      const stats = await loadExistingStats();

      // 总访问次数+1
      stats.totalVisits += 1;

      // 更新当前访客的访问记录
      const visitorIndex = stats.visitors.findIndex(v => v.id === visitorId);
      if (visitorIndex === -1) {
        // 新访客：添加记录
        stats.visitors.push({
          id: visitorId,
          firstVisit: now,
          lastVisit: now,
          visitCount: 1
        });
      } else {
        // 老访客：更新次数和最后访问时间
        stats.visitors[visitorIndex].visitCount += 1;
        stats.visitors[visitorIndex].lastVisit = now;
      }

      // 保存统计数据（无论是否出错，都尝试保存）
      await saveUpdatedStats(stats);
    })();
  </script>
</body>
</html>
