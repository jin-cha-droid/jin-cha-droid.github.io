<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body ontouchstart="">
    {% include nav.html %}
    {% include search.html %}

    <!-- 主站独立统计代码（核心：只统计主站，不关联后台） -->
    <script>
        // 1. 配置（替换为你的Gist ID和仅gist权限的PAT）
        const CONFIG = {
            gistId: "778c919fa51dbc8b932261916da783e7", // 你的Gist ID
            gistFile: "blog_stats.json", // 新建一个专门存主站统计的文件（避免和后台数据混）
            pat: "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" // 仅gist权限的PAT
        };
        const MAIN_SITE = "https://jin-cha-droid.github.io/"; // 只统计这个域名

        // 2. 生成主站专属访客ID（和后台ID区分）
        function getMainSiteVisitorId() {
            let id = localStorage.getItem('main_site_visitor_id');
            if (!id) {
                // 生成规则：确保和后台ID完全不同，避免统计混淆
                id = "MAIN_" + Date.now() + "_" + Math.random().toString(36).substr(2, 15);
                localStorage.setItem('main_site_visitor_id', id);
            }
            return id;
        }

        // 3. 读取主站统计数据
        async function loadMainSiteStats() {
            try {
                const res = await fetch(`https://api.github.com/gists/${CONFIG.gistId}`, {
                    headers: {
                        'Authorization': `token ${CONFIG.pat}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (res.ok) {
                    const gist = await res.json();
                    // 如果没有专门的统计文件，初始化空数据
                    const content = gist.files[CONFIG.gistFile]?.content || JSON.stringify({
                        visitors: [], // 主站独立访客列表
                        totalVisits: 0, // 主站总访问次数
                        pageViews: {} // 各页面访问次数
                    });
                    return JSON.parse(content);
                }
                // 初始化空数据
                return { visitors: [], totalVisits: 0, pageViews: {} };
            } catch (err) {
                console.log('读取主站统计失败：', err);
                return { visitors: [], totalVisits: 0, pageViews: {} };
            }
        }

        // 4. 核心：仅统计主站访问（彻底排除后台）
        async function reportMainSiteVisit() {
            // 过滤：只统计主站访问，排除后台页面
            if (!window.location.href.startsWith(MAIN_SITE) || window.location.href.includes('blog-admin')) {
                return; // 后台页面不统计
            }

            const visitorId = getMainSiteVisitorId();
            const stats = await loadMainSiteStats();
            const now = new Date().toISOString();
            const currentPage = window.location.pathname || '/'; // 只取路径，比如/、/about/

            // 1. 总访问次数+1（每一次主站访问都加）
            stats.totalVisits += 1;

            // 2. 独立访客统计（去重）
            const isNewVisitor = !stats.visitors.some(v => v.id === visitorId);
            if (isNewVisitor) {
                stats.visitors.push({
                    id: visitorId,
                    firstVisit: now,
                    lastVisit: now,
                    visitCount: 1
                });
            } else {
                // 老访客：更新最后访问时间+访问次数
                const visitor = stats.visitors.find(v => v.id === visitorId);
                visitor.lastVisit = now;
                visitor.visitCount += 1;
            }

            // 3. 页面访问统计
            stats.pageViews[currentPage] = stats.pageViews[currentPage] || { count: 0, lastVisit: now };
            stats.pageViews[currentPage].count += 1;
            stats.pageViews[currentPage].lastVisit = now;

            // 保存到Gist（只存主站统计，不和后台数据混）
            try {
                await fetch(`https://api.github.com/gists/${CONFIG.gistId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${CONFIG.pat}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: {
                            [CONFIG.gistFile]: { content: JSON.stringify(stats, null, 2) }
                        }
                    })
                });
                console.log('主站访问已统计：', {
                    visitorId: visitorId,
                    totalVisits: stats.totalVisits,
                    uniqueVisitors: stats.visitors.length
                });
            } catch (err) {
                console.log('保存主站统计失败：', err);
            }
        }

        // 5. 页面加载后立即触发主站统计（强制执行）
        window.addEventListener('load', async () => {
            await reportMainSiteVisit();
        });

        // 6. 拉黑检测（保留原有功能）
        async function checkBanStatus() {
            try {
                const res = await fetch(`https://api.github.com/gists/${CONFIG.gistId}`, {
                    headers: {
                        'Authorization': `token ${CONFIG.pat}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                const gist = await res.json();
                const banContent = gist.files['blog_admin.json']?.content || '{"bannedIds":[]}';
                const banData = JSON.parse(banContent);
                const bannedList = banData.bannedIds || [];
                
                if (bannedList.includes(getMainSiteVisitorId())) {
                    document.body.innerHTML = `
                        <div style="width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8f9fa;">
                            <h1 style="color: #dc3545; font-size: 32px;">🚫 你已被禁止访问</h1>
                            <p style="color: #6c757d; margin-top: 20px;">违反访问规则，联系管理员解封</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.log('拉黑检测失败：', err);
            }
        }
        checkBanStatus();
    </script>

    <!-- 公告条（保留） -->
    <div id="blog-notice-container" style="display: none; background: #f8d7da; color: #721c24; padding: 12px 20px; border: 1px solid #f5c6cb; border-radius: 4px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center;">
        <span id="notice-text"></span>
        <button onclick="this.parentElement.style.display='none'" style="background: transparent; border: none; color: #721c24; cursor: pointer; font-size: 16px; padding: 0 8px; line-height: 1;">&times;</button>
    </div>

    {{ content }}
    {% include footer.html %}
</body>
</html>
