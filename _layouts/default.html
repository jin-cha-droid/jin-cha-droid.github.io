<!DOCTYPE html>

<body ontouchstart="">
{% include nav.html %}
{% include search.html %}

<!-- ========== 核心功能：主站统计+拉黑检测+公告 ========== -->
<script>
  // 基础配置（替换为你的Gist ID，PAT通过后台输入，不直接写在代码里）
  const SITE_CONFIG = {
    gistId: "778c919fa51dbc8b932261916da783e7",
    mainDomain: "https://jin-cha-droid.github.io/",
    statsFile: "site_visitor_stats.json",    // 访客统计数据
    banFile: "site_ban_list.json",            // 拉黑名单
    noticeFile: "site_notice.json"            // 公告内容
  };

  // 1. 生成唯一访客ID
  function getVisitorId() {
    let id = localStorage.getItem('site_unique_visitor_id');
    if (!id) {
      id = `VIS_${Date.now()}_${Math.random().toString(36).slice(2, 14)}`;
      localStorage.setItem('site_unique_visitor_id', id);
    }
    return id;
  }

  // 新增：设备类型检测函数
  function getDeviceType() {
    const userAgent = navigator.userAgent.toLowerCase();
    const isMobile = /mobile|android|iphone|ipad|ipod|blackberry|windows phone/i.test(userAgent);
    const isTablet = /ipad|tablet|kindle|nexus 7|nexus 10/i.test(userAgent);
    
    if (isTablet) return "平板";
    if (isMobile) return "手机";
    return "电脑";
  }

  // 2. 通用Gist请求函数（需传入PAT）
  async function requestGist(pat, method = 'GET', fileContent = {}) {
    try {
      const headers = {
        'Authorization': `token ${pat}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      };
      const options = { method, headers };
      
      if (method === 'PATCH') {
        options.body = JSON.stringify({ files: fileContent });
      }

      const res = await fetch(`https://api.github.com/gists/${SITE_CONFIG.gistId}`, options);
      return res.ok ? await res.json() : null;
    } catch (e) {
      console.error('Gist请求失败：', e);
      return null;
    }
  }

  // 3. 主站访客统计（仅统计主站，排除后台）
  async function trackMainSiteVisit(pat) {
    // 严格校验：仅统计前台主站，排除任何后台页面
    const currentUrl = window.location.href;
    // 排除包含admin的页面，且仅统计主域名下的前台页面
    if (!currentUrl.startsWith(SITE_CONFIG.mainDomain) || currentUrl.includes('admin')) {
      return; 
    }

    const visitorId = getVisitorId();
    const now = new Date().toISOString();
    const deviceType = getDeviceType(); // 获取设备类型
    const gistData = await requestGist(pat);
    
    // 初始化统计数据
    let stats = { visitors: [], totalVisits: 0 };
    if (gistData && gistData.files[SITE_CONFIG.statsFile]) {
      stats = JSON.parse(gistData.files[SITE_CONFIG.statsFile].content);
    }

    // 更新统计
    stats.totalVisits += 1;
    const visitorIndex = stats.visitors.findIndex(v => v.id === visitorId);
    if (visitorIndex === -1) {
      stats.visitors.push({
        id: visitorId,
        firstVisit: now,
        lastVisit: now,
        visitCount: 1,
        ip: '', // 可扩展IP记录（需额外接口）
        device: deviceType, // 新增设备类型字段
        userAgent: navigator.userAgent // 保留原始UA，便于后续扩展
      });
    } else {
      stats.visitors[visitorIndex].lastVisit = now;
      stats.visitors[visitorIndex].visitCount += 1;
      // 保留首次检测的设备类型，避免同一访客切换设备导致数据变化
      if (!stats.visitors[visitorIndex].device) {
        stats.visitors[visitorIndex].device = deviceType;
      }
    }

    // 保存统计数据
    await requestGist(pat, 'PATCH', {
      [SITE_CONFIG.statsFile]: { content: JSON.stringify(stats, null, 2) }
    });
  }

  // 4. 拉黑检测
  async function checkBanStatus(pat) {
    const visitorId = getVisitorId();
    const gistData = await requestGist(pat);
    
    let banList = { bannedIds: [] };
    if (gistData && gistData.files[SITE_CONFIG.banFile]) {
      banList = JSON.parse(gistData.files[SITE_CONFIG.banFile].content);
    }

    if (banList.bannedIds.includes(visitorId)) {
      document.body.innerHTML = `
        <div style="width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8f9fa;">
          <h1 style="color: #dc3545; font-size: 32px;">🚫 你已被禁止访问</h1>
          <p style="color: #6c757d; margin-top: 20px;">违反访问规则，联系管理员解封</p>
        </div>
      `;
      return true;
    }
    return false;
  }

  // 5. 公告展示
  async function showNotice(pat) {
    const gistData = await requestGist(pat);
    let notice = { content: '', show: false };
    
    if (gistData && gistData.files[SITE_CONFIG.noticeFile]) {
      notice = JSON.parse(gistData.files[SITE_CONFIG.noticeFile].content);
    }

    if (notice.show && notice.content) {
      const noticeEl = document.getElementById('blog-notice-container');
      const noticeText = document.getElementById('notice-text');
      noticeText.innerText = notice.content;
      noticeEl.style.display = 'flex';
    }
  }

  // 6. 初始化（从后台缓存读取PAT，避免硬编码）
  async function initSiteFeatures() {
    const pat = localStorage.getItem('site_admin_pat');
    if (!pat) return; // 未配置PAT则仅基础访问，不统计/检测
    
    const isBanned = await checkBanStatus(pat);
    if (!isBanned) {
      await trackMainSiteVisit(pat);
      await showNotice(pat);
    }
  }

  // 页面加载后执行
  window.addEventListener('load', initSiteFeatures);
</script>

<!-- 公告条（保留原有样式） -->
<div id="blog-notice-container" style="display: none; background: #f8d7da; color: #721c24; padding: 12px 20px; border: 1px solid #f5c6cb; border-radius: 4px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center;">
  <span id="notice-text"></span>
  <button onclick="this.parentElement.style.display='none'" style="background: transparent; border: none; color: #721c24; cursor: pointer; font-size: 16px; padding: 0 8px; line-height: 1;">&times;</button>
</div>

{{ content }}
{% include footer.html %}
</body>
</html>
